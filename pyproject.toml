[project]
name = "nfc-timecard"
version = "0.1.0"
description = "Local Windows-only NFC timecard (FastAPI + nfcpy)"
requires-python = ">=3.13"
dependencies = [
    "nfcpy>=1.0.4",
    "fastapi>=0.103.0",
    "uvicorn[standard]>=0.22.0",
    "pandas>=1.5.0",
    "setuptools>=61.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
